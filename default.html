<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Georgia, serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            body {
                padding: 40px 80px;
            }
        }
        
        h1 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 20px;
        }
        
        h2 {
            font-size: 18px;
            font-weight: normal;
            margin-top: 40px;
            margin-bottom: 15px;
        }
        
        p {
            margin-bottom: 15px;
        }
        
        a {
            color: #000;
            text-decoration: underline;
        }
        
        a:hover {
            text-decoration: none;
        }
        
        ul {
            list-style-position: inside;
            margin-bottom: 15px;
        }
        
        li {
            margin-bottom: 8px;
        }
        
        .contact {
            margin-bottom: 30px;
        }
        
        .headshot {
            max-width: 200px;
            height: auto;
            margin: 20px 0;
            display: block;
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
